services:
  postgres:
    image: postgres:16-alpine
    container_name: codetrack_postgres
    environment:
      POSTGRES_USER: codetrack
      POSTGRES_PASSWORD: codetrack
      POSTGRES_DB: codetrack_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
