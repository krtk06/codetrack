name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: krtk2
          POSTGRES_PASSWORD: codetrack
          POSTGRES_DB: codetrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krtk2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://krtk2:codetrack@localhost:5432/codetrack_test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations (test DB)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://krtk2:codetrack@localhost:5432/codetrack_test
        run: npx prisma migrate deploy

      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://krtk2:codetrack@localhost:5432/codetrack_test
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
        run: npm test

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build
